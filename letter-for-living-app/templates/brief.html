<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>기획서 보기</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="wrap">
      <section class="panel">
        <div class="panel-header">
          <h2>기획서</h2>
          <button type="submit" form="briefForm" class="confirm-button">저장</button>
        </div>
        <p class="meta">{{ file }}</p>
        {% if notice %}
        <p class="meta">{{ notice }}</p>
        {% endif %}
        <form id="briefForm" method="post">
          <textarea name="content" rows="24">{{ content }}</textarea>
        </form>
        <a href="/">← 돌아가기</a>
      </section>
    </main>
  </body>
</html>
